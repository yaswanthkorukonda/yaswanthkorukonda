name: Update profile card

on:
  schedule:
    - cron: "30 0 * * *"      # every day at 00:30 UTC (6:00 AM India time)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:                     # also run when you change the photo or the script
      - "assets/**"
      - "generate_card.py"

permissions:
  contents: write              # lets the job save the new dark_mode.svg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build the card
        run: python generate_card.py

      - name: Save the card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
